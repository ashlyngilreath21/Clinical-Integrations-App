          { stage: "3. Acute On-Field Management", question: "What physical diagnostic guidelines determine if radiographs are needed for an acute ankle injury?", options: [{ id: "A", label: "Ottawa Ankle Rules (bony tenderness over posterior malleoli, navicular, or 5th metatarsal base)", isCorrect: true }, { id: "B", label: "Lachman Diagnostic Rules", isCorrect: false }, { id: "C", label: "Thompson Calf Squeeze Criteria", isCorrect: false }, { id: "D", label: "West Point Ankle Score", isCorrect: false }], explanation: "Ottawa Ankle Rules provide highly sensitive criteria to rule out unnecessary X-rays." },
          { stage: "4. Interventions & Rehabilitation", question: "What functional training component is vital to prevent recurrent ankle sprains during dynamic sports?", options: [{ id: "A", label: "Progressive neuromuscular balance, proprioceptive retraining, and peroneal strength development", isCorrect: true }, { id: "B", label: "Prolonged non-weight-bearing casting for 6 weeks", isCorrect: false }, { id: "C", label: "Heavy concentric calf raises only", isCorrect: false }, { id: "D", label: "Immobilization in a rigid knee brace", isCorrect: false }], explanation: "Proprioceptive and dynamic neuromuscular training significantly reduces re-injury rates." },
          { stage: "5. Return to Sport Clearance", question: "What functional test demonstrates readiness to return to field sports following a Grade II lateral ankle sprain?", options: [{ id: "A", label: "Pain-free figure-8 agility run, single-leg hop test (>90% symmetry), and dynamic cutting drills", isCorrect: true }, { id: "B", label: "Ability to walk 100 steps on flat terrain", isCorrect: false }, { id: "C", label: "Absence of lateral malleolus skin bruising", isCorrect: false }, { id: "D", label: "Passive ankle inversion matching opposite side", isCorrect: false }], explanation: "Return to play requires dynamic multi-directional stability and confidence during agility testing." }
        ]
      },
      {
        id: 10,
        title: "Case 10: Hamstring Muscle Strain",
        category: "Posterior Thigh Mechanics",
        youtubeId: "L_LUpnjgPso",
        questions: [
          { stage: "1. Mechanism of Injury", question: "During which phase of high-speed sprinting does the hamstring complex experience its maximum strain?", options: [{ id: "A", label: "Terminal swing phase during eccentric deceleration of the extending lower leg", isCorrect: true }, { id: "B", label: "Stance phase during initial contact", isCorrect: false }, { id: "C", label: "Mid-support phase during hip extension", isCorrect: false }, { id: "D", label: "Early swing phase during knee flexion", isCorrect: false }], explanation: "Hamstring strains occur under high eccentric load as the muscle lengthens to decelerate the swing leg." },
          { stage: "2. Differential Diagnosis", question: "Which hamstring muscle belly is most frequently injured during high-speed running activities?", options: [{ id: "A", label: "Biceps Femoris (long head)", isCorrect: true }, { id: "B", label: "Semitendinosus", isCorrect: false }, { id: "C", label: "Semimembranosus", isCorrect: false }, { id: "D", label: "Gracilis", isCorrect: false }], explanation: "The long head of the biceps femoris sustains the highest stretch and activation during terminal swing." },
          { stage: "3. Acute On-Field Management", question: "What immediate management framework is recommended within the first 48 hours for an acute muscle strain?", options: [{ id: "A", label: "PEACE & LOVE protocol (Protect, Elevate, Avoid anti-inflammatories, Compress, Educate & Load)", isCorrect: true }, { id: "B", label: "Immediate deep friction massage over acute tear", isCorrect: false }, { id: "C", label: "Aggressive passive static stretching to maximum end-range", isCorrect: false }, { id: "D", label: "Application of high-heat hydrocollator packs", isCorrect: false }], explanation: "Modern acute management emphasizes protection, compression, and early optimal loading over complete rest." },
          { stage: "4. Interventions & Rehabilitation", question: "What exercise mode has been proven most effective in hamstring strain rehabilitation and secondary prevention?", options: [{ id: "A", label: "High-load eccentric strengthening (e.g., Nordic Hamstring Curls) at long muscle lengths", isCorrect: true }, { id: "B", label: "Low-intensity isometric leg curls", isCorrect: false }, { id: "C", label: "Passive hamstring stretching on a slant board", isCorrect: false }, { id: "D", label: "Concentric-only leg extension exercises", isCorrect: false }], explanation: "Eccentric overload training shifts the optimal length-tension relationship toward longer muscle lengths." },
          { stage: "5. Return to Sport Clearance", question: "What objective strength metric is required before clearing a sprinter following a Grade II biceps femoris strain?", options: [{ id: "A", label: ">90% limb symmetry on eccentric hamstring dynamometry and pain-free full-velocity sprinting drills", isCorrect: true }, { id: "B", label: "4 weeks of calendar rest regardless of strength", isCorrect: false }, { id: "C", label: "Ability to jog at 50% pace without limping", isCorrect: false }, { id: "D", label: "Absence of tenderness during seated palpation", isCorrect: false }], explanation: "High-speed sprinting requires proven eccentric strength symmetry and graduated velocity exposure." }
        ]
      }
    ];

    function App() {
      const [role, setRole] = useState(null);
      const [studentName, setStudentName] = useState('');
      const [clientId] = useState(() => 'user_' + Math.random().toString(36).substr(2, 9));

      const [sessionState, setSessionState] = useState({
        caseIndex: 0,
        qIndex: -1,
        gameState: 'case_intro',
        timeLeft: 30
      });

      const [selectedOption, setSelectedOption] = useState(null);
      const [myScore, setMyScore] = useState(0);
      const [myStreak, setMyStreak] = useState(0);
      const [participants, setParticipants] = useState({});
      const [dbRef, setDbRef] = useState(null);

      const [shuffledOptions, setShuffledOptions] = useState([]);

      const currentCase = casesData[sessionState?.caseIndex || 0] || casesData[0];
      const isIntro = sessionState.gameState === 'case_intro' || sessionState.qIndex === -1;
      const currentQuestion = !isIntro ? currentCase.questions[sessionState.qIndex] : null;

      // Randomize options locally per device every time a question loads
      useEffect(() => {
        if (!currentQuestion || !currentQuestion.options) {
          setShuffledOptions([]);
          return;
        }
        let opts = JSON.parse(JSON.stringify(currentQuestion.options));
        for (let i = opts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        const finalOpts = opts.map((opt, idx) => ({
          ...opt,
          id: String.fromCharCode(65 + idx)
        }));
        setShuffledOptions(finalOpts);
        setSelectedOption(null);
      }, [sessionState.caseIndex, sessionState.qIndex]);

      useEffect(() => {
        try {
          if (typeof firebase !== 'undefined' && FIREBASE_DATABASE_URL) {
            if (!firebase.apps.length) {
              firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
            }
            const database = firebase.database();
            setDbRef(database);

            const stateRef = database.ref('classroom/state');
            stateRef.on('value', (snapshot) => {
              const val = snapshot.val();
              if (val) {
                setSessionState(val);
              } else {
                database.ref('classroom/state').set({
                  caseIndex: 0,
                  qIndex: -1,
                  gameState: 'case_intro',
                  timeLeft: 30
                });
              }
            });

            const rosterRef = database.ref('classroom/roster');
            rosterRef.on('value', (snapshot) => {
              const val = snapshot.val();
              if (val) setParticipants(val);
              else setParticipants({});
            });

            return () => {
              stateRef.off();
              rosterRef.off();
            };
          }
        } catch (err) {
          console.warn("Cloud sync initialization notice:", err);
        }
      }, []);

      const handleJoinStudent = () => {
        if (!studentName.trim()) {
          alert('Please enter your full name.');
          return;
        }
        setRole('student');
        if (dbRef) {
          try {
            dbRef.ref(`classroom/roster/${clientId}`).set({
              name: studentName,
              score: 0,
              status: 'Active'
            });
          } catch(e) {}
        }
      };

      const handleJoinPresenter = () => {
        setRole('presenter');
      };

      const updateCloudState = (updates) => {
        const newState = { ...sessionState, ...updates };
        setSessionState(newState);
        if (dbRef) {
          try {
            dbRef.ref('classroom/state').set(newState);
          } catch(e) {}
        }
      };

      const handleRestartSession = () => {
        if (confirm("Start a brand new session? This will clear all previous student rosters and reset back to Case 1 Intro.")) {
          const freshState = {
            caseIndex: 0,
            qIndex: -1,
            gameState: 'case_intro',
            timeLeft: 30
          };
          if (dbRef) {
            try {
              dbRef.ref('classroom/roster').remove();
              dbRef.ref('classroom/state').set(freshState);
            } catch(e) {}
          }
          setSessionState(freshState);
          setMyScore(0);
          setMyStreak(0);
          setSelectedOption(null);
        }
      };

      useEffect(() => {
        if (role !== 'presenter' || sessionState.gameState !== 'question') return;
        if (sessionState.timeLeft <= 0) {
          updateCloudState({ gameState: 'revealed' });
          return;
        }
        const timer = setInterval(() => {
          updateCloudState({ timeLeft: sessionState.timeLeft - 1 });
        }, 1000);
        return () => clearInterval(timer);
      }, [sessionState.timeLeft, sessionState.gameState, role, dbRef]);

      const handlePresenterNext = () => {
        if (sessionState.gameState === 'case_intro') {
          updateCloudState({
            qIndex: 0,
            gameState: 'question',
            timeLeft: 30
          });
        } else if (sessionState.gameState === 'question') {
          updateCloudState({ gameState: 'revealed' });
        } else if (sessionState.gameState === 'revealed') {
          if (sessionState.qIndex < currentCase.questions.length - 1) {
            updateCloudState({
              qIndex: sessionState.qIndex + 1,
              gameState: 'question',
              timeLeft: 30
            });
          } else if (sessionState.caseIndex < casesData.length - 1) {
            updateCloudState({
              caseIndex: sessionState.caseIndex + 1,
              qIndex: -1,
              gameState: 'case_intro',
              timeLeft: 30
            });
          } else {
            updateCloudState({ gameState: 'final_leaderboard' });
          }
        }
      };

      const handleStudentSubmit = (optId) => {
        if (selectedOption !== null || sessionState.gameState !== 'question' || !currentQuestion) return;
        setSelectedOption(optId);

        const chosen = shuffledOptions.find(o => o.id === optId);
        let earned = 0;
        let newStreak = myStreak;

        if (chosen && chosen.isCorrect) {
          earned = Math.round((1000 + (sessionState.timeLeft * 15)) * (1 + (myStreak * 0.15)));
          newStreak += 1;
          setMyStreak(newStreak);
        } else {
          newStreak = 0;
          setMyStreak(0);
        }

        const newScore = myScore + earned;
        setMyScore(newScore);

        if (dbRef) {
          try {
            dbRef.ref(`classroom/roster/${clientId}`).update({
              score: newScore,
              status: 'Answered'
            });
          } catch(e) {}
        }
      };

      if (!role) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center space-y-6">
              <div className="inline-flex p-3 bg-brand-500/10 text-brand-500 rounded-xl">
                <svg className="w-10 h-10" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
              </div>
              <div>
                <h1 className="text-2xl font-bold text-white tracking-tight">Clinical Integrations in Sports</h1>
                <p className="text-slate-400 text-sm mt-1">Live Classroom Session (10 Cases)</p>
              </div>
              
              <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-left space-y-3">
                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Your Name (For Live Roster)</label>
                <input 
                  type="text" 
                  placeholder="Enter full name" 
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-brand-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-4 pt-2">
                <button onClick={handleJoinStudent} className="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-brand-600/20">Join Student</button>
                <button onClick={handleJoinPresenter} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-4 rounded-xl border border-slate-700">Presenter Screen</button>
              </div>
              <div className="text-xs text-slate-500">Room Code: <span className="text-brand-500 font-bold">CLINICAL-2026</span></div>
            </div>
          </div>
        );
      }

      if (sessionState.gameState === 'final_leaderboard') {
        const sortedRoster = Object.values(participants || {}).sort((a,b) => b.score - a.score);
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6">
            <div className="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 text-center">
              <div className="inline-flex p-3 bg-brand-500/20 text-brand-400 rounded-full font-bold text-xs uppercase tracking-widest">🏆 Final Course Leaderboard</div>
              <h2 className="text-2xl font-black text-white">Top Clinical Performers</h2>

              <div className="space-y-3 text-left max-h-96 overflow-y-auto">
                {sortedRoster.map((p, idx) => (
                  <div key={idx} className={`p-4 rounded-xl border flex justify-between items-center ${idx === 0 ? 'bg-amber-500/10 border-amber-500/50 text-amber-200' : 'bg-slate-950 border-slate-800 text-slate-300'}`}>
                    <div className="flex items-center space-x-3">
                      <span className={`w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs ${idx === 0 ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>{idx + 1}</span>
                      <span className="font-semibold">{p.name}</span>
                    </div>
                    <span className="font-mono font-bold text-brand-400">{p.score} pts</span>
                  </div>
                ))}
              </div>

              <button 
                onClick={handleRestartSession}
                className="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 rounded-2xl transition shadow-lg shadow-brand-600/20"
              >
                Start New Session / Clear Roster
              </button>
            </div>
          </div>
        );
      }

      if (role === 'presenter') {
        const rosterList = Object.values(participants || {});
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
            <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="bg-brand-500/20 text-brand-400 border border-brand-500/30 text-xs px-2.5 py-1 rounded-full font-bold">Presenter Control</span>
                <h1 className="font-bold text-lg text-white">{currentCase.title} &bull; {isIntro ? 'Case Video Intro' : `Question ${sessionState.qIndex + 1} of 5`}</h1>
              </div>
              <div className="flex items-center space-x-3">
                <button onClick={handleRestartSession} className="text-xs bg-amber-600/20 hover:bg-amber-600/30 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg font-semibold">Start New Session</button>
                <button onClick={() => setRole(null)} className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">Exit Session</button>
              </div>
            </header>

            <main className="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">
              <div className="lg:col-span-2 space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                  <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/50">
                    <span className="text-xs font-bold uppercase tracking-wider text-brand-400">{currentCase.category}</span>
                    <span className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">Case {(sessionState?.caseIndex || 0) + 1} / 10</span>
                  </div>
                  <div className="aspect-video w-full bg-black">
                    <iframe 
                      src={`https://www.youtube.com/embed/${currentCase.youtubeId}?autoplay=1&mute=1&rel=0`} 
                      title={currentCase.title} 
                      className="w-full h-full" 
                      referrerPolicy="strict-origin-when-cross-origin" 
                      allow="autoplay; encrypted-media; picture-in-picture"
                      allowFullScreen>
                    </iframe>
                  </div>
                </div>

                {!isIntro && currentQuestion && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                    <div className="text-xs font-bold uppercase tracking-wider text-brand-400">{currentQuestion.stage}</div>
                    <h2 className="text-lg font-bold text-white">{currentQuestion.question}</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {shuffledOptions.map(opt => (
                        <div key={opt.id} className={`p-4 rounded-xl border flex items-center justify-between ${sessionState.gameState === 'revealed' && opt.isCorrect ? 'bg-emerald-950/40 border-emerald-500 text-emerald-200' : 'bg-slate-950 border-slate-800 text-slate-300'}`}>
                          <div className="flex items-center space-x-3">
                            <span className="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-xs">{opt.id}</span>
                            <span className="text-sm font-medium">{opt.label}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                    {sessionState.gameState === 'revealed' && (
                      <div className="mt-4 p-4 rounded-xl bg-brand-950/30 border border-brand-500/30 text-brand-200 text-sm">
                        <strong>Clinical Rationale:</strong> {currentQuestion.explanation}
                      </div>
                    )}
                  </div>
                )}
              </div>

              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center space-y-4 shadow-xl">
                  {isIntro ? (
                    <>
                      <div className="text-xs font-semibold uppercase tracking-wider text-brand-400">Case Video Preview</div>
                      <p className="text-xs text-slate-400">Review the clinical case video with your audience before starting the evaluation questions.</p>
                      <button onClick={handlePresenterNext} className="w-full py-4 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl shadow-lg shadow-brand-600/20">
                        Start Question 1 →
                      </button>
                    </>
                  ) : (
                    <>
                      <div className="text-xs font-semibold uppercase tracking-wider text-slate-400">Classroom Synced Timer</div>
                      <div className="text-6xl font-black text-brand-400">{sessionState.timeLeft}s</div>
                      <button onClick={handlePresenterNext} className="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl shadow-lg shadow-brand-600/20">
                        {sessionState.gameState === 'question' ? 'Reveal Rationale' : 'Next Question →'}
                      </button>
                    </>
                  )}
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-3">
                  <div className="text-xs font-semibold uppercase tracking-wider text-slate-400">Live Student Roster ({rosterList.length} Connected)</div>
                  <div className="space-y-2 max-h-64 overflow-y-auto">
                    {rosterList.length === 0 ? (
                      <div className="text-xs text-slate-500 italic">Waiting for students to join...</div>
                    ) : (
                      rosterList.map((p, idx) => (
                        <div key={idx} className="p-2.5 rounded-lg bg-slate-950 border border-slate-800 flex justify-between items-center text-xs">
                          <span className="text-slate-200 font-medium">{p.name}</span>
                          <div className="flex items-center space-x-2">
                            <span className="text-brand-400 font-mono font-bold">{p.score} pts</span>
                            <span className={`px-2 py-0.5 rounded font-bold ${p.status === 'Answered' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>
                              {p.status}
                            </span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            </main>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col p-4 max-w-lg mx-auto justify-between">
          <header className="flex justify-between items-center py-3 border-b border-slate-800">
            <div>
              <span className="text-xs text-brand-400 font-semibold">Student Portal</span>
              <div className="text-sm font-bold text-white">{studentName}</div>
            </div>
            <div className="text-right">
              <div className="text-xs text-slate-400">Score</div>
              <div className="text-lg font-black text-brand-400">{myScore} pts</div>
            </div>
          </header>

          <main className="py-6 space-y-6">
            {isIntro ? (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center space-y-6 shadow-xl my-auto">
                <div className="inline-flex p-3 bg-brand-500/10 text-brand-400 rounded-full font-bold text-xs uppercase tracking-widest">Case Video Preview</div>
                <h2 className="text-xl font-bold text-white">{currentCase.title}</h2>
                <p className="text-xs text-slate-400">Please watch the video on the presenter screen. Questions will begin shortly when the presenter starts the session.</p>
                <div className="text-xs text-brand-400 font-semibold animate-pulse pt-4">Waiting for presenter to start questions...</div>
              </div>
            ) : (
              <>
                <div className="flex justify-between items-center bg-slate-900 border border-slate-800 px-4 py-3 rounded-xl">
                  <div>
                    <div className="text-xs font-bold text-brand-400">{currentQuestion?.stage}</div>
                    <div className="text-xs text-slate-400">Case {(sessionState?.caseIndex || 0) + 1} / 10 &bull; Question {(sessionState?.qIndex || 0) + 1}/5</div>
                  </div>
                  <span className="text-xs bg-brand-500/20 text-brand-400 px-2.5 py-1 rounded-full font-bold">Streak: {myStreak}🔥</span>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-xl">
                  <h2 className="text-sm font-bold text-white leading-relaxed">{currentQuestion?.question}</h2>

                  <div className="space-y-3 pt-2">
                    {shuffledOptions.map(opt => {
                      const isSelected = selectedOption === opt.id;
                      const isRevealed = sessionState.gameState === 'revealed';
                      let btnColor = "bg-slate-950 border-slate-800 text-slate-200 hover:border-slate-600";
                      if (isSelected) btnColor = "bg-brand-950 border-brand-500 text-brand-200 ring-2 ring-brand-500/30";
                      if (isRevealed && opt.isCorrect) btnColor = "bg-emerald-950 border-emerald-500 text-emerald-200";

                      return (
                        <button
                          key={opt.id}
                          disabled={selectedOption !== null || sessionState.gameState === 'revealed'}
                          onClick={() => handleStudentSubmit(opt.id)}
                          className={`w-full p-4 rounded-xl border text-left font-medium text-xs leading-normal transition flex items-center justify-between ${btnColor} ${selectedOption !== null ? 'opacity-80 cursor-not-allowed' : ''}`}
                        >
                          <div className="flex items-start space-x-3">
                            <span className="w-5 h-5 rounded bg-slate-800 flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">{opt.id}</span>
                            <span>{opt.label}</span>
                          </div>
                          {isSelected && <span className="text-xs text-brand-400 font-bold">Submitted</span>}
                        </button>
                      );
                    })}
                  </div>

                  {sessionState.gameState === 'revealed' && (
                    <div className="mt-4 p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-300 space-y-2">
                      <strong className="text-white block">Clinical Rationale:</strong>
                      <p>{currentQuestion?.explanation}</p>
                    </div>
                  )}
                </div>
              </>
            )}
          </main>

          <footer className="text-center py-4 border-t border-slate-800 text-xs text-slate-500">
            Clinical Integrations in Sports &bull; Room: CLINICAL-2026
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
